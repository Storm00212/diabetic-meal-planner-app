# GlucoPlate on Render — single Express app, one Postgres database.
#
# The backend is one Express app serving all endpoints on one port.
# Render Free tier: 750 instance-hours/month, sleeps after 15 min idle.
#
#   1. Create Neon database branch and fill in env vars below.
#   2. Push this blueprint, or create a Web Service by hand:
#        Build command : npm install --include=dev && npm run build
#        Start command : npm run start:all
#        Health path   : /api/health
#   3. Run migrations:
#        DATABASE_URL=<neon-url> npm run db:push
#        DATABASE_URL=<neon-url> npm run db:seed

services:
  - type: web
    name: glucoplate-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:all
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # Database (Neon) — use DIRECT connection with pool params
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      # Groq LLM (backend only, free tier)
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "llama-3.1-8b-instant"
      # Demo mode: one-click login buttons for 5 personas
      - key: DEMO_MODE
        value: "true"
      # M-Pesa Daraja SANDBOX
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CALLBACK_URL
        value: "https://glucoplate-api.onrender.com/api/mpesa/callback"